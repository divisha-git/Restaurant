<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="home.css">
    <script src="script.js"></script>
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger py-2 sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-3" href="index.html">THECRAVE</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link text-white px-3" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-white px-3" href="about.html">About</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white px-3" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Menu
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="veg.html">Veg Menu</a></li>
                            <li><a class="dropdown-item" href="non-veg.html">Non-Veg Menu</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link text-white px-3" href="cont.html">Contact</a></li>
                </ul>
                <div class="d-flex align-items-center mt-3 mt-lg-0">
                    <form class="d-flex me-3" action="veg.html" method="get">
                        <input class="form-control me-2 rounded-pill" type="search" name="search" placeholder="Search Menu" aria-label="Search">
                        <button class="btn btn-warning rounded-pill px-3" type="submit">Search</button>
                    </form>
                    <a class="nav-link text-white cart-icon position-relative ms-3" href="cart.html">
                        <i class="fas fa-shopping-cart fa-lg"></i>
                        <span id="cart-count" class="cart-count position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark border border-white">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="text-center text-danger fw-bold mb-4">Your Shopping Cart</h2>
        
        <div class="row">
            <div class="col-lg-8">
                <div class="card bg-dark border-secondary shadow-sm mb-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover mb-0">
                                <thead class="table-danger">
                                    <tr>
                                        <th class="ps-4">Item</th>
                                        <th class="text-center">Price</th>
                                        <th class="text-center">Quantity</th>
                                        <th class="text-center">Subtotal</th>
                                        <th class="text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="cart-items-body">
                                    <!-- Items will be injected here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div id="empty-cart-msg" class="text-center d-none">
                    <h4 class="text-secondary">Your cart is empty</h4>
                    <a href="veg.html" class="btn btn-warning mt-3">Go to Menu</a>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="card bg-dark border-secondary shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title text-danger mb-4">Order Summary</h4>
                        <hr class="bg-secondary">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal</span>
                            <span>₹<span id="subtotal-amount">0</span></span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Delivery Fee</span>
                            <span class="text-success">FREE</span>
                        </div>
                        <hr class="bg-secondary">
                        <div class="d-flex justify-content-between mb-4">
                            <h5 class="fw-bold">Total</h5>
                            <h5 class="fw-bold text-warning">₹<span id="total-amount">0</span></h5>
                        </div>
                        <button class="btn btn-success w-100 mb-2 py-2 fw-bold" onclick="checkout()">Proceed to Checkout</button>
                        <button class="btn btn-outline-danger w-100 mb-2" onclick="clearCart()">Clear Cart</button>
                        <a href="veg.html" class="btn btn-outline-light w-100">Continue Shopping</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function displayCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let cartTableBody = document.getElementById("cart-items-body");
            let emptyMsg = document.getElementById("empty-cart-msg");
            let cartContent = document.querySelector(".row");
            
            if (cart.length === 0) {
                cartContent.classList.add("d-none");
                emptyMsg.classList.remove("d-none");
                return;
            }

            cartContent.classList.remove("d-none");
            emptyMsg.classList.add("d-none");
            cartTableBody.innerHTML = "";

            let total = 0;
            cart.forEach((item, index) => {
                let subtotal = item.price * item.quantity;
                total += subtotal;
                cartTableBody.innerHTML += `
                    <tr>
                        <td class="ps-4 align-middle">
                            <div class="d-flex align-items-center">
                                <img src="${item.img}" alt="${item.name}" class="rounded me-3" style="width: 50px; height: 50px; object-fit: cover;">
                                <span class="fw-bold">${item.name}</span>
                            </div>
                        </td>
                        <td class="text-center align-middle">₹${item.price}</td>
                        <td class="text-center align-middle">
                            <div class="d-flex justify-content-center align-items-center">
                                <button class="btn btn-sm btn-outline-light px-2 py-0" onclick="updateQuantity(${index}, -1)">-</button>
                                <span class="mx-3">${item.quantity}</span>
                                <button class="btn btn-sm btn-outline-light px-2 py-0" onclick="updateQuantity(${index}, 1)">+</button>
                            </div>
                        </td>
                        <td class="text-center align-middle">₹${subtotal}</td>
                        <td class="text-center align-middle">
                            <button class="btn btn-sm btn-danger" onclick="removeFromCart(${index})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById("subtotal-amount").textContent = total;
            document.getElementById("total-amount").textContent = total;
            updateCartCount();
        }

        function updateQuantity(index, change) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem("cart", JSON.stringify(cart));
            displayCart();
        }

        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            displayCart();
        }

        function clearCart() {
            if (confirm("Are you sure you want to clear your cart?")) {
                localStorage.removeItem("cart");
                displayCart();
            }
        }

        function checkout() {
            window.location.href = "foodord.html";
        }

        document.addEventListener("DOMContentLoaded", displayCart);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   </body>
</html>
